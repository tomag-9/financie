name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t financie-ci .
      - name: Runtime smoke test
        run: |
          docker run -d --name financie-ci -p 3000:3000 \
            -e DATABASE_URL=file:/data/financie.db \
            -e AUTH_SECRET=ci-only-secret-that-is-long-enough-for-runtime \
            -e ADMIN_PASSWORD=ci-only-password financie-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs financie-ci
          exit 1
