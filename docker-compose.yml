services:
  financie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financie-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/financie.db
      NEXTAUTH_URL: https://finance.tomag.xyz
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      ENABLE_CRON: ${ENABLE_CRON:-true}
      DEFAULT_SAVINGS_TARGET: ${DEFAULT_SAVINGS_TARGET:-20}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
      SEED_DATA_PASSWORD: ${SEED_DATA_PASSWORD:-}
      SEED_DATA_ENCODE_PASSWORD: ${SEED_DATA_ENCODE_PASSWORD:-}
      SEED_DATA_DECODE_PASSWORD: ${SEED_DATA_DECODE_PASSWORD:-}
      CLAUDE_ALARM_COMMAND: ${CLAUDE_ALARM_COMMAND:-docker exec -i claude-cli claude "Say, hello"}
      CODEX_ALARM_COMMAND: ${CODEX_ALARM_COMMAND:-docker exec -i codex-cli codex "Say, hello"}
      - TZ=Europe/Bratislava
    volumes:
      - financie_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.financie-http.rule=Host(`finance.tomag.xyz`)"
      - "traefik.http.routers.financie-http.entrypoints=web"
      - "traefik.http.routers.financie-http.service=financie"
      - "traefik.http.routers.financie-https.rule=Host(`finance.tomag.xyz`)"
      - "traefik.http.routers.financie-https.entrypoints=websecure"
      - "traefik.http.routers.financie-https.tls=true"
      - "traefik.http.routers.financie-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.financie-https.service=financie"
      - "traefik.http.services.financie.loadbalancer.server.port=3000"
    networks:
      - default
      - dokploy-network

volumes:
  financie_data:

networks:
  dokploy-network:
    external: true
