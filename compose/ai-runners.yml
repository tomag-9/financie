services:
  claude:
    build:
      context: ..
      dockerfile: compose/claude-cli.Dockerfile
    image: financie-claude-cli:local
    container_name: claude-cli
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - claude-home:/root
    command: sh
    stdin_open: true
    tty: true

  codex:
    image: node:20-alpine
    container_name: codex-cli
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -lc "npm install -g @openai/codex && exec sh"
    stdin_open: true
    tty: true

volumes:
  claude-home:
