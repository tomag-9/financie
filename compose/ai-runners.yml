services:
  claude:
    build:
      context: ..
      dockerfile: compose/claude-cli.Dockerfile
    image: financie-claude-cli:local
    container_name: claude-cli
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - claude-home:/root
    command: sh
    stdin_open: true
    tty: true

  codex:
    build:
      context: ..
      dockerfile: compose/codex-cli.Dockerfile
    image: financie-codex-cli:local
    container_name: codex-cli
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - codex-home:/root
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: sh
    stdin_open: true
    tty: true

volumes:
  claude-home:
  codex-home:
