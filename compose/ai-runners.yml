services:
  ai-runner:
    build:
      context: ..
      dockerfile: compose/ai-runner.Dockerfile
    image: financie-ai-runner:local
    container_name: ai-runner
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - claude-home:/auth/claude-home
      - codex-home:/auth/codex-home
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: sh
    stdin_open: true
    tty: true

volumes:
  claude-home:
  codex-home:
