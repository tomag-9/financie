services:
  claude:
    image: node:20-alpine
    container_name: claude-cli
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -lc "npm install -g @anthropic-ai/claude-code && exec sh"
    stdin_open: true
    tty: true

  codex:
    image: node:20-alpine
    container_name: codex-cli
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -lc "npm install -g @openai/codex && exec sh"
    stdin_open: true
    tty: true
