services:
  financie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financie-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/financie.db
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      ENABLE_CRON: ${ENABLE_CRON:-true}
      DEFAULT_SAVINGS_TARGET: ${DEFAULT_SAVINGS_TARGET:-20}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
      SEED_DATA_PASSWORD: ${SEED_DATA_PASSWORD:-}
      SEED_DATA_ENCODE_PASSWORD: ${SEED_DATA_ENCODE_PASSWORD:-}
      SEED_DATA_DECODE_PASSWORD: ${SEED_DATA_DECODE_PASSWORD:-}
      SEED_ON_START: ${SEED_ON_START:-true}
      CLAUDE_ALARM_COMMAND: ${CLAUDE_ALARM_COMMAND:-'docker exec -i claude-cli claude "Say, hello"'}
      CODEX_ALARM_COMMAND: ${CODEX_ALARM_COMMAND:-'docker exec -i codex-cli codex "Say, hello"'}
    volumes:
      - financie_data_dev:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  financie_data_dev:
